name: CI

on:
  pull_request:
  push:
    branches: [codex/android-foundation]

permissions:
  contents: read

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test privacy and publication rules
        working-directory: server
        run: python3 -m unittest discover -s tests -v

  android-debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled SDK
        run: test -d "$ANDROID_HOME/platforms/android-36"
      - name: Build debug APK
        working-directory: clients/android
        run: bash gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: wenfou-debug-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
