name: Server
on:
  pull_request:
    paths: ['server/**', 'deploy/**', 'scripts/**', 'contracts/**', '.github/workflows/server.yml']
  push:
    branches: [codex/server-foundation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wenfou
          POSTGRES_PASSWORD: ci-only-not-for-deployment
          POSTGRES_DB: wenfou_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wenfou -d wenfou_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install --require-hashes -r server/requirements-dev.txt
      - name: SQLite API and original privacy rules
        run: PYTHONPATH=server pytest server/tests -q
      - name: PostgreSQL migrations and concurrency
        env:
          TEST_DATABASE_URL: postgresql+psycopg://wenfou:ci-only-not-for-deployment@localhost:5432/wenfou_test
        run: PYTHONPATH=server pytest server/tests -q
      - name: Environment generator and shell syntax
        run: |
          pytest scripts/test_configure.py -q
          for script in scripts/*.sh deploy/*.sh; do bash -n "$script"; done
      - name: OpenAPI contract is current
        run: |
          PYTHONPATH=server python - <<'PY'
          import json
          from pathlib import Path
          from wenfou.api import create_app
          from wenfou.config import Settings
          assert json.loads(Path('contracts/openapi-v0.4.json').read_text()) == create_app(Settings(environment='test')).openapi()
          PY
  deployment-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build, deploy, smoke, restart, restore and validate production config
        run: bash scripts/ci-compose.sh
      - name: Collect container status and redacted image metadata
        if: always()
        run: |
          mkdir -p deployment-results
          bash scripts/compose.sh ps --all > deployment-results/status.txt
          docker image ls --digests > deployment-results/images.txt
          bash scripts/compose.sh logs --tail 100 api > deployment-results/api.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-deployment-results
          path: deployment-results/
